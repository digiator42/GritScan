[package]
name = "gritscan-backend"
version = "0.1.0"
edition = "2021"
description = "Proactive attack surface scanner & vulnerability manager built on GritShield"

[features]
default = ["sqlite", "mcp"]
sqlite = ["gritshield/sqlite"]
mcp = ["gritshield/mcp"]

[dependencies]
gritshield = { version = "0.3.1", default-features = false }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sea-orm = { version = "1.1", features = ["runtime-tokio-native-tls", "sqlx-sqlite", "with-chrono"] }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
chrono = "0.4"

[profile.release]
lto = true
